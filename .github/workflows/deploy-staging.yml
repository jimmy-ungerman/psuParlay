name: Deploy to Staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/psu-parlay

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update staging manifests in GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${GITOPS_PAT}@github.com/jimmy-ungerman/pork3s.git /tmp/pork3s
          cd /tmp/pork3s

          RESOURCE_NAME="psu-parlay-pr-${PR_NUMBER}"

          yq e ".metadata.name = \"${RESOURCE_NAME}\"" \
            -i kubernetes/apps/staging/psu-parlay/ks.yaml

          yq e ".metadata.name = \"${RESOURCE_NAME}\"" \
            -i kubernetes/apps/staging/psu-parlay/app/helmrelease.yaml
          yq e ".spec.values.app.image.tag = \"${IMAGE_TAG}@${IMAGE_DIGEST}\"" \
            -i kubernetes/apps/staging/psu-parlay/app/helmrelease.yaml

          # Ensure helmrelease and ocirepository are present alongside externalsecret
          yq e '.resources = ["./helmrelease.yaml", "./ocirepository.yaml", "./externalsecret.yaml"]' \
            -i kubernetes/apps/staging/psu-parlay/app/kustomization.yaml

          git add kubernetes/apps/staging/psu-parlay/
          git diff --cached --quiet || git commit -m "chore: deploy psu-parlay ${RESOURCE_NAME}"
          git push
