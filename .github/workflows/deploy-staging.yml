name: Deploy to Staging

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/psu-parlay

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update staging HelmRelease in GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          IMAGE_TAG: staging-${{ steps.sha.outputs.short }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${GITOPS_PAT}@github.com/jimmy-ungerman/pork3s.git /tmp/pork3s
          cd /tmp/pork3s
          yq e ".spec.values.app.image.tag = \"${IMAGE_TAG}@${IMAGE_DIGEST}\"" \
            -i kubernetes/apps/staging/psu-parlay/app/helmrelease.yaml
          git add kubernetes/apps/staging/psu-parlay/app/helmrelease.yaml
          git diff --cached --quiet || git commit -m "chore: deploy psu-parlay staging ${IMAGE_TAG}"
          git push
