name: Teardown Staging

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  teardown-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Delete PR image from GHCR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin
          crane delete ghcr.io/${{ github.repository_owner }}/psu-parlay:pr-${PR_NUMBER} || true

      - name: Remove HelmRelease from staging kustomization in GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${GITOPS_PAT}@github.com/jimmy-ungerman/pork3s.git /tmp/pork3s
          cd /tmp/pork3s

          # Remove helmrelease and ocirepository — Flux will prune them, uninstalling the release
          yq e '.resources = ["./externalsecret.yaml"]' \
            -i kubernetes/apps/staging/psu-parlay/app/kustomization.yaml

          git add kubernetes/apps/staging/psu-parlay/app/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: teardown psu-parlay staging pr-${PR_NUMBER}"
          git push
