apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psu-parlay.backend.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "psu-parlay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  PORT: "3001"
  DB_HOST: {{ include "psu-parlay.postgres.host" . | quote }}
  DB_PORT: {{ .Values.postgres.port | toString | quote }}
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  NODE_ENV: "production"
