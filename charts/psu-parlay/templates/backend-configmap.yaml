apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psu-parlay.backend.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "psu-parlay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  PORT: "3001"
  DB_PATH: {{ .Values.sqlite.dbPath | quote }}
  NODE_ENV: "production"
