apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psu-parlay.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "psu-parlay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "psu-parlay.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "psu-parlay.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: {{ include "psu-parlay.backend.fullname" . }}-config
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CORS_ORIGIN
              value: {{ include "psu-parlay.corsOrigin" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- include "psu-parlay.secretRef.jwtSecret" . | nindent 18 }}
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "psu-parlay.secretRef.vapidPublicKey" . | nindent 18 }}
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "psu-parlay.secretRef.vapidPrivateKey" . | nindent 18 }}
            - name: ODDS_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "psu-parlay.secretRef.oddsApiKey" . | nindent 18 }}
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: {{ include "psu-parlay.backend.fullname" . }}-sqlite-pvc
