nameOverride: ""
fullnameOverride: ""

# -- App
app:
  image:
    repository: ghcr.io/jimmy-ungerman/psu-parlay
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    # nodePort: 30080 # only used when type is NodePort
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  # Size of the PersistentVolumeClaim for the SQLite database
  storage: "1Gi"
  # storageClassName: "" # uncomment to set a specific storage class
  # existingSecret: "" # name of an existing secret whose keys are injected as env vars

# -- HTTPRoute (Gateway API)
httproute:
  enabled: false
  parentRefs:
    - name: my-gateway
      # namespace: gateway-system
  hostnames:
    - parlay.local
