nameOverride: ""
fullnameOverride: ""

# -- Backend (Node.js/Express API)
backend:
  image:
    repository: psuparlay-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    # Only used when type is NodePort
    nodePort: 30080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  config:
    # Live spreads from https://the-odds-api.com — leave empty to use mock mode.
    # Ignored when oddsApiExistingSecret is set.
    oddsApiKey: ""
    # Reference an existing Secret for the odds API key instead of the inline value above.
    oddsApiExistingSecret: ""
    oddsApiExistingSecretKey: "odds-api-key"
    # VAPID keys for web push notifications.
    # Generate a fresh pair with: npx web-push generate-vapid-keys
    # Ignored when vapidExistingSecret is set.
    vapidPublicKey: ""
    vapidPrivateKey: ""
    # Reference an existing Secret for VAPID keys instead of the inline values above.
    vapidExistingSecret: ""
    vapidPublicKeyKey: "vapid-public-key"
    vapidPrivateKeyKey: "vapid-private-key"

# -- SQLite
sqlite:
  # Size of the PersistentVolumeClaim used to store the database file.
  storage: "1Gi"
  # storageClassName: "" # uncomment to set a specific storage class
  # Path inside the container where the database file will be stored.
  dbPath: "/data/psuparlay.db"

# -- Secrets (change all of these before deploying)
secrets:
  # Inline JWT secret — used to create a chart-managed Secret.
  # Ignored when existingSecret is set.
  jwtSecret: "change-this-to-a-long-random-string"
  # Reference an existing Secret for the JWT secret instead of the inline value above.
  existingSecret: ""
  existingSecretKey: "jwt-secret"

# -- Ingress (traditional nginx-style)
ingress:
  enabled: false
  className: nginx
  host: parlay.local
  # annotations: {}
  # tls: []

# -- HTTPRoute (Gateway API) — use this instead of ingress if your cluster runs a Gateway API controller
httproute:
  enabled: false
  # One or more parentRefs pointing at your Gateway resource(s)
  parentRefs:
    - name: my-gateway
      # namespace: gateway-system  # uncomment if the Gateway lives in a different namespace
  # Hostnames the route should match — leave empty to match all hostnames on the Gateway
  hostnames:
    - parlay.local
