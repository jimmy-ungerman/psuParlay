services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psuparlay
      POSTGRES_USER: psuparlay
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psuparlay"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: psuparlay
      DB_USER: psuparlay
      DB_PASSWORD: devpassword
      PORT: 3001
      CORS_ORIGIN: "http://localhost:5173"
      JWT_SECRET: "dev-secret-not-for-prod"
      VAPID_PUBLIC_KEY: "BN8TOqqcECo5I94S9lscOvOqgWzcEIgT3J_gKKieBOYTEzC6U_z2sIq1TVLwabjvQRpvbrt0I7fJ8KJFAhU37yA"
      VAPID_PRIVATE_KEY: "eCtc8TgphgulDTS4V97zrl3DzjJvua8YeuKTe2CEAQk"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
